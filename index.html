<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체육관 사용 현황판</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        
        /* 🚀 화면 전체 상하좌우 중앙 정렬 */
        .screen { display: none; }
        .screen.active { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 80px 20px; /* 상단 고정바 공간 확보 */
            box-sizing: border-box; 
            animation: fadeIn 0.3s; 
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 🚀 좌측/우측 최상단 고정 네비게이션 바 */
        .top-navbar {
            position: fixed;
            top: 20px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none; /* 빈 공간은 클릭 통과 */
        }
        .top-navbar > * { pointer-events: auto; /* 버튼은 클릭 가능하게 복구 */ }
        
        /* 홈 버튼 스타일 */
        .home-link {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            margin: 0;
            background: white;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 2px solid #ddd;
            transition: all 0.2s;
        }
        .home-link:hover { background: #eee; transform: translateY(-2px); }

        /* 상단 우측 버튼 그룹 */
        .top-buttons { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; background-color: #555; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s;}
        .btn:hover { background-color: #333; transform: translateY(-2px); }
        .btn-bulk { background-color: #8e44ad; }
        .btn-bulk:hover { background-color: #732d91; }

        /* 중앙 정렬용 타이틀 */
        .page-title { font-size: 2.5rem; color: #2c3e50; margin-bottom: 10px; text-align: center; }

        /* 초기 화면 전용 */
        .home-btns { display: flex; justify-content: center; gap: 30px; margin-top: 30px; }
        .btn-large { padding: 20px 40px; font-size: 1.5rem; background-color: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .btn-large:hover { transform: translateY(-3px); background-color: #45a049; }
        .btn-large.secondary { background-color: #3498db; }
        .btn-large.secondary:hover { background-color: #2980b9; }

        /* 날짜 네비게이터 (주간) */
        .date-navigator { display: flex; justify-content: center; align-items: center; margin-bottom: 25px; }
        .date-box { font-size: 20px; font-weight: bold; border: 2px solid #333; padding: 10px 20px; margin: 0 15px; background: white; border-radius: 8px; }
        .arrow { font-size: 24px; cursor: pointer; user-select: none; padding: 5px 15px; background: #ddd; border-radius: 5px; transition: background 0.2s; }
        .arrow:hover { background: #ccc; }

        /* 주간 표 스타일 */
        .table-wrapper { 
            width: 100%; 
            max-width: 1000px;
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            overflow-x: auto; 
            background: white;
        }
        table { width: 100%; min-width: 650px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; vertical-align: middle; }
        th { background-color: #4CAF50; color: white; font-size: 16px; padding: 15px 5px; }
        
        tr:first-child th { border-top: none; }
        tr:last-child td { border-bottom: none; }
        th:first-child, td:first-child { border-left: none; background-color: #f9f9f9; }
        th:last-child, td:last-child { border-right: none; }

        .period-info { font-weight: bold; font-size: 16px; }
        .time-info { font-size: 11px; color: #666; margin-top: 3px; }
        
        /* 예약 슬롯 스타일 */
        .slot-available { cursor: pointer; transition: background 0.2s; }
        .slot-available:hover { background-color: #e8f5e9; }
        .slot-booked { background-color: #ffebee; border: 1px solid #ffcdd2; }
        .slot-selected { background-color: #8e44ad !important; color: white !important; font-weight: bold; border: 2px solid #732d91; cursor: pointer; }
        .slot-disabled { background-color: #eee; color: #aaa; cursor: not-allowed; }
        
        .book-text { font-size: 14px; font-weight: bold; color: #c62828; }
        .add-icon { color: #aaa; font-size: 12px; }

        /* 리스트 관리용 작은 버튼 */
        .btn-action { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; color: white; margin: 0 2px;}
        .btn-edit { background-color: #f39c12; }
        .btn-delete { background-color: #e74c3c; }

        /* 달력 스타일 */
        .month-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; width: 100%; max-width: 600px; }
        .month-btn { padding: 25px; font-size: 1.5rem; background: white; border: 2px solid #4CAF50; border-radius: 10px; cursor: pointer; text-align: center; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .month-btn:hover { background: #4CAF50; color: white; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 20px; width: 100%; max-width: 800px; }
        .cal-header { background: #eee; font-weight: bold; padding: 15px; text-align: center; border-radius: 5px; }
        .cal-day { padding: 30px 10px; text-align: center; border: 1px solid #ddd; border-radius: 5px; font-size: 1.5rem; background: white; cursor: pointer; transition: all 0.2s;}
        .cal-day.weekend { background: #f9f9f9; color: #aaa; cursor: not-allowed; }
        .cal-day:hover:not(.weekend):not(.empty) { background: #e8f5e9; border-color: #4CAF50; transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 2;}
        .cal-day.empty { border: none; background: transparent; cursor: default; }

        /* 모달창 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 350px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal input, .modal select { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        .save-btn { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; font-size: 16px; font-weight: bold;}
        .cancel-btn { background: #ccc; color: #333; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; font-size: 16px; }

        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .admin-box { background: #eee; padding: 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .admin-box:hover { background: #ddd; }
        
        .modal-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="screen-home" class="screen active">
        <h1 class="page-title" style="font-size: 3.5rem; margin-bottom: 40px;">체육관 사용 현황판</h1>
        <div class="home-btns">
            <button class="btn-large" onclick="showScreen('screen-month-select')">📅 예약 (달력)</button>
            <button class="btn-large secondary" onclick="goToToday()">🏃 이번 주로 이동</button>
        </div>
        <button class="btn" style="margin-top: 60px;" onclick="openAdminModal()">⚙️ 관리자 설정</button>
    </div>

    <div id="screen-month-select" class="screen">
        <div class="top-navbar">
            <div class="home-link" onclick="goHome()">🏠 홈으로</div>
        </div>
        <h1 class="page-title">월별 달력 보기</h1>
        <div class="month-grid" id="monthGrid"></div>
    </div>

    <div id="screen-calendar" class="screen">
        <div class="top-navbar">
            <div class="home-link" onclick="goHome()">🏠 홈으로</div>
            <div class="top-buttons">
                <button class="btn" onclick="showScreen('screen-month-select')">🔙 월 선택</button>
            </div>
        </div>
        <h1 class="page-title" id="calendarTitle">2026년 O월 달력</h1>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div id="screen-weekly" class="screen">
        <div class="top-navbar">
            <div class="home-link" onclick="goHome()">🏠 홈으로</div>
            <div class="top-buttons">
                <button class="btn btn-bulk" onclick="openBulkSelectModal()">✅ 한번에 예약</button>
                <button class="btn" onclick="showScreen('screen-month-select')">📅 달력</button>
                <button class="btn" onclick="openAdminModal()">⚙️ 설정</button>
            </div>
        </div>
        
        <h1 class="page-title">주간 체육관 사용 현황</h1>
        <div class="date-navigator">
            <div class="arrow" onclick="changeWeek(-1)">&#9664; 이전 주</div>
            <div class="date-box" id="currentWeekDisplay">MM/DD ~ MM/DD</div>
            <div class="arrow" onclick="changeWeek(1)">다음 주 &#9654;</div>
        </div>
        
        <div class="table-wrapper">
            <table>
                <thead><tr id="weeklyHeader"></tr></thead>
                <tbody id="weeklyBody"></tbody>
            </table>
        </div>
    </div>

    <div id="screen-admin-list" class="screen">
        <div class="top-navbar">
            <div class="home-link" onclick="goHome()">🏠 홈으로</div>
            <div class="top-buttons">
                <button class="btn" onclick="goHome()">완료</button>
            </div>
        </div>
        <h1 class="page-title">예약 관리 (수정 및 삭제)</h1>
        <div class="table-wrapper" style="margin-top: 20px;">
            <table>
                <thead><tr><th>날짜</th><th>교시</th><th>예약내용</th><th>관리</th></tr></thead>
                <tbody id="adminListBody"></tbody>
            </table>
        </div>
    </div>

    <div id="bulkSelectModal" class="modal">
        <div class="modal-content" style="width: 95%; max-width: 800px;">
            <h2 style="color: #8e44ad;">한번에 예약하기 (시간 선택)</h2>
            <p style="color: #555; font-size: 14px;">예약하고 싶은 시간을 모두 클릭한 후 다음 버튼을 누르세요.</p>
            
            <div class="table-wrapper" style="max-height: 50vh; overflow-y: auto; margin-bottom: 0;">
                <table id="bulkTable"></table>
            </div>
            
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal('bulkSelectModal')">취소</button>
                <button class="save-btn" style="background-color: #8e44ad;" onclick="goToBulkInput()">다음 ➡</button>
            </div>
        </div>
    </div>

    <div id="reservationModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">예약하기</h2>
            <input type="hidden" id="editDateKey">
            <select id="resGrade">
                <option value="" disabled selected>학년 선택</option>
                <option value="1학년">1학년</option>
                <option value="2학년">2학년</option>
                <option value="3학년">3학년</option>
                <option value="4학년">4학년</option>
                <option value="5학년">5학년</option>
                <option value="6학년">6학년</option>
                <option value="전담">전담</option>
            </select>
            <select id="resClass">
                <option value="" disabled selected>반 선택 (생략 가능)</option>
                <option value="1반">1반</option>
                <option value="2반">2반</option>
                <option value="3반">3반</option>
                <option value="4반">4반</option>
                <option value="5반">5반</option>
                <option value="6반">6반</option>
            </select>
            <input type="text" id="resTeacher" placeholder="선생님 성함 (또는 주관식)">
            
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal('reservationModal')">취소</button>
                <button class="save-btn" onclick="saveReservation()">저장하기</button>
            </div>
        </div>
    </div>

    <div id="adminModal" class="modal">
        <div class="modal-content" style="width: 400px;">
            <h2>관리자 설정</h2>
            <div id="adminLogin">
                <input type="password" id="adminPwdInput" placeholder="비밀번호를 입력하세요">
                <button class="save-btn" onclick="checkAdmin()">확인</button>
            </div>
            <div id="adminPanel" style="display: none;">
                <div class="admin-grid">
                    <div class="admin-box" onclick="openAdminList()">✏️/🗑️ 예약 수정 및 삭제</div>
                    <div class="admin-box" onclick="openChangePwdModal()">🔑 비밀번호 변경</div>
                </div>
            </div>
            <button class="cancel-btn" onclick="closeModal('adminModal')">닫기</button>
        </div>
    </div>

    <div id="pwdModal" class="modal">
        <div class="modal-content">
            <h2>비밀번호 변경</h2>
            <input type="password" id="oldPwd" placeholder="현재 비밀번호">
            <input type="password" id="newPwd" placeholder="바꿀 비밀번호">
            <input type="password" id="newPwdConfirm" placeholder="바꿀 비밀번호 확인">
            <button class="save-btn" onclick="saveNewPassword()">저장</button>
            <button class="cancel-btn" onclick="closeModal('pwdModal')">취소</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB-QM37R2uhMsb074E5YMmn-CsIArE-mgs",
            authDomain: "gym-schedule-ce39e.firebaseapp.com",
            databaseURL: "https://gym-schedule-ce39e-default-rtdb.firebaseio.com",
            projectId: "gym-schedule-ce39e",
            storageBucket: "gym-schedule-ce39e.firebasestorage.app",
            messagingSenderId: "579577452137",
            appId: "1:579577452137:web:fbe88244a09421b33634f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const CURRENT_YEAR = 2026;
        const periods = ["1교시", "2교시", "3교시", "4교시", "5교시", "6교시", "7교시"];
        const periodTimes = ["09:00~09:40", "09:50~10:30", "10:40~11:20", "11:30~12:10", "12:20~13:00", "13:00~13:40", "13:50~14:30"];
        
        let currentDate = new Date();
        let currentSelectedPeriod = null;
        let isEditMode = false;
        let currentViewMonth = null;
        let reservationsData = {};
        let adminPassword = localStorage.getItem('gymPwd') || "0000";

        let isBulkMode = false;
        let bulkSelectionArray = [];

        db.ref('reservations').on('value', (snapshot) => {
            reservationsData = snapshot.val() || {};
            if (document.getElementById('screen-weekly').classList.contains('active')) updateWeeklyDisplay();
            else if (document.getElementById('screen-admin-list').classList.contains('active')) openAdminList();
            else if (document.getElementById('screen-calendar').classList.contains('active') && currentViewMonth !== null) renderCalendar(currentViewMonth);
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'screen-month-select') renderMonthSelect();
        }

        function goHome() { showScreen('screen-home'); }

        function getMonday(d) {
            d = new Date(d);
            let day = d.getDay();
            let diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function getDateKey(date) {
            return `${CURRENT_YEAR}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function goToToday() {
            currentDate = new Date();
            updateWeeklyDisplay();
            showScreen('screen-weekly');
        }

        function renderMonthSelect() {
            const grid = document.getElementById("monthGrid");
            grid.innerHTML = "";
            for(let i=1; i<=12; i++) {
                let btn = document.createElement("div");
                btn.className = "month-btn";
                btn.innerText = `${i}월`;
                btn.onclick = () => renderCalendar(i);
                grid.appendChild(btn);
            }
        }

        function renderCalendar(month) {
            currentViewMonth = month;
            document.getElementById("calendarTitle").innerText = `${CURRENT_YEAR}년 ${month}월`;
            const grid = document.getElementById("calendarGrid");
            grid.innerHTML = "";
            const days = ["일", "월", "화", "수", "목", "금", "토"];
            days.forEach(d => { grid.innerHTML += `<div class="cal-header">${d}</div>`; });
            const firstDay = new Date(CURRENT_YEAR, month - 1, 1).getDay();
            const lastDate = new Date(CURRENT_YEAR, month, 0).getDate();
            for(let i=0; i<firstDay; i++) { grid.innerHTML += `<div class="cal-day empty"></div>`; }
            for(let day=1; day<=lastDate; day++) {
                let targetDate = new Date(CURRENT_YEAR, month - 1, day);
                let dayOfWeek = targetDate.getDay();
                let dayDiv = document.createElement("div");
                dayDiv.innerText = day;
                if (dayOfWeek === 0 || dayOfWeek === 6) dayDiv.className = "cal-day weekend";
                else {
                    dayDiv.className = "cal-day";
                    dayDiv.onclick = () => { currentDate = targetDate; updateWeeklyDisplay(); showScreen('screen-weekly'); };
                }
                grid.appendChild(dayDiv);
            }
            showScreen('screen-calendar');
        }

        function changeWeek(offset) {
            currentDate.setDate(currentDate.getDate() + (offset * 7));
            updateWeeklyDisplay();
        }

        function updateWeeklyDisplay() {
            const monday = getMonday(currentDate);
            const friday = new Date(monday);
            friday.setDate(monday.getDate() + 4);
            document.getElementById("currentWeekDisplay").innerText = `${monday.getMonth()+1}/${monday.getDate()} ~ ${friday.getMonth()+1}/${friday.getDate()}`;
            
            const headerRow = document.getElementById("weeklyHeader");
            headerRow.innerHTML = `<th style="width: 15%;">교시</th>`;
            let weekDates = [];
            const dayNames = ["월", "화", "수", "목", "금"];
            for(let i=0; i<5; i++) {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDates.push(d);
                headerRow.innerHTML += `<th style="width: 17%;">${d.getMonth()+1}/${d.getDate()} (${dayNames[i]})</th>`;
            }

            const tbody = document.getElementById("weeklyBody");
            tbody.innerHTML = "";
            periods.forEach((periodName, index) => {
                const tr = document.createElement("tr");
                let tdHtml = `<td><div class="period-info">${periodName}</div><div class="time-info">${periodTimes[index]}</div></td>`;
                weekDates.forEach(dateObj => {
                    const dateKey = getDateKey(dateObj);
                    const res = (reservationsData[dateKey] || {})[periodName];
                    if (res) {
                        tdHtml += `<td class="slot-booked"><div class="book-text">${res.text}</div></td>`;
                    } else {
                        tdHtml += `<td class="slot-available" onclick="openReservationModal('${periodName}', '${dateKey}', false)"><span class="add-icon">➕ 예약</span></td>`;
                    }
                });
                tr.innerHTML = tdHtml;
                tbody.appendChild(tr);
            });
        }

        function openBulkSelectModal() {
            bulkSelectionArray = [];
            isBulkMode = true;

            const modalTable = document.getElementById("bulkTable");
            const monday = getMonday(currentDate);

            let headerHtml = `<thead><tr><th style="width:15%">교시</th>`;
            let weekDates = [];
            const dayNames = ["월", "화", "수", "목", "금"];
            for(let i=0; i<5; i++) {
                let d = new Date(monday);
                d.setDate(monday.getDate() + i);
                weekDates.push(d);
                headerHtml += `<th>${d.getDate()}일(${dayNames[i]})</th>`;
            }
            headerHtml += `</tr></thead><tbody id="bulkBody"></tbody>`;
            modalTable.innerHTML = headerHtml;

            const tbody = document.getElementById("bulkBody");
            periods.forEach(period => {
                const tr = document.createElement("tr");
                let tdHtml = `<td style="font-weight:bold;">${period}</td>`;
                
                weekDates.forEach(dateObj => {
                    const dateKey = getDateKey(dateObj);
                    const res = (reservationsData[dateKey] || {})[period];
                    
                    if (res) {
                        tdHtml += `<td class="slot-disabled">예약됨</td>`;
                    } else {
                        tdHtml += `<td class="slot-available" onclick="toggleBulkSlot('${dateKey}', '${period}', this)"><span class="add-icon">선택가능</span></td>`;
                    }
                });
                tr.innerHTML = tdHtml;
                tbody.appendChild(tr);
            });

            document.getElementById("bulkSelectModal").style.display = "flex";
        }

        function toggleBulkSlot(dateKey, period, cell) {
            const index = bulkSelectionArray.findIndex(item => item.dateKey === dateKey && item.period === period);
            
            if (index > -1) {
                bulkSelectionArray.splice(index, 1);
                cell.classList.remove('slot-selected');
                cell.classList.add('slot-available');
                cell.innerHTML = `<span class="add-icon">선택가능</span>`;
            } else {
                bulkSelectionArray.push({ dateKey, period });
                cell.classList.remove('slot-available');
                cell.classList.add('slot-selected');
                cell.innerHTML = `✔️ 선택됨`;
            }
        }

        function goToBulkInput() {
            if (bulkSelectionArray.length === 0) {
                alert("예약할 시간을 1개 이상 선택해주세요!");
                return;
            }
            closeModal('bulkSelectModal');
            
            document.getElementById("modalTitle").innerText = `총 ${bulkSelectionArray.length}개 일괄 예약하기`;
            document.getElementById("resGrade").value = "";
            document.getElementById("resClass").value = "";
            document.getElementById("resTeacher").value = "";
            document.getElementById("reservationModal").style.display = "flex";
        }

        function openReservationModal(period, targetDateKey, isEdit) {
            isBulkMode = false;
            isEditMode = isEdit;
            currentSelectedPeriod = period;
            document.getElementById("editDateKey").value = targetDateKey;
            
            if (isEditMode) {
                document.getElementById("modalTitle").innerText = "예약 수정";
            } else {
                let parts = targetDateKey.split('-');
                document.getElementById("modalTitle").innerText = `${parts[1]}월 ${parts[2]}일 ${period} 예약`;
            }
            document.getElementById("resGrade").value = "";
            document.getElementById("resClass").value = "";
            document.getElementById("resTeacher").value = "";
            document.getElementById("reservationModal").style.display = "flex";
        }

        function closeModal(id) { document.getElementById(id).style.display = "none"; }

        function saveReservation() {
            const grade = document.getElementById("resGrade").value || '';
            const classNum = document.getElementById("resClass").value || '';
            const teacher = document.getElementById("resTeacher").value;
            
            if (!teacher) { alert("선생님 성함이나 내용을 입력해주세요."); return; }
            const text = `${grade} ${classNum} ${teacher}`.trim();
            
            if (isBulkMode) {
                let updates = {};
                bulkSelectionArray.forEach(item => {
                    updates[`reservations/${item.dateKey}/${item.period}`] = { text: text };
                });
                
                db.ref().update(updates).then(() => {
                    closeModal('reservationModal');
                    alert(`${bulkSelectionArray.length}개의 일괄 예약이 완료되었습니다!`);
                    isBulkMode = false;
                    bulkSelectionArray = [];
                }).catch(() => alert("일괄 저장에 실패했습니다."));

            } else {
                const dateKey = document.getElementById("editDateKey").value;
                db.ref(`reservations/${dateKey}/${currentSelectedPeriod}`).set({
                    text: text
                }).then(() => {
                    closeModal('reservationModal');
                    alert("저장되었습니다.");
                }).catch(() => alert("저장에 실패했습니다."));
            }
        }

        function openAdminModal() {
            document.getElementById("adminLogin").style.display = "block";
            document.getElementById("adminPanel").style.display = "none";
            document.getElementById("adminPwdInput").value = "";
            document.getElementById("adminModal").style.display = "flex";
        }

        function checkAdmin() {
            if (document.getElementById("adminPwdInput").value === adminPassword) {
                document.getElementById("adminLogin").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
            } else alert("비밀번호가 틀렸습니다.");
        }

        function openChangePwdModal() {
            closeModal('adminModal');
            document.getElementById("oldPwd").value = "";
            document.getElementById("newPwd").value = "";
            document.getElementById("newPwdConfirm").value = "";
            document.getElementById("pwdModal").style.display = "flex";
        }

        function saveNewPassword() {
            const old = document.getElementById("oldPwd").value;
            const newP = document.getElementById("newPwd").value;
            const confirmP = document.getElementById("newPwdConfirm").value;
            if (old !== adminPassword) { alert("현재 비밀번호가 틀립니다."); return; }
            if (newP !== confirmP) { alert("바꿀 비밀번호가 서로 일치하지 않습니다."); return; }
            if (newP === "") { alert("새 비밀번호를 입력하세요."); return; }
            localStorage.setItem('gymPwd', newP);
            adminPassword = newP;
            alert("비밀번호가 변경되었습니다.");
            closeModal('pwdModal');
        }

        function openAdminList() {
            closeModal('adminModal');
            const tbody = document.getElementById("adminListBody");
            tbody.innerHTML = "";
            const sortedDates = Object.keys(reservationsData).sort();
            sortedDates.forEach(dateKey => {
                const dayData = reservationsData[dateKey];
                periods.forEach(period => {
                    if (dayData[period]) {
                        const tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${dateKey}</td>
                            <td>${period}</td>
                            <td>${dayData[period].text}</td>
                            <td>
                                <button class="btn-action btn-edit" onclick="openReservationModal('${period}', '${dateKey}', true)">수정</button>
                                <button class="btn-action btn-delete" onclick="deleteReservation('${dateKey}', '${period}')">삭제</button>
                            </td>`;
                        tbody.appendChild(tr);
                    }
                });
            });
            showScreen('screen-admin-list');
        }

        function deleteReservation(dateKey, period) {
            if (confirm(`정말 ${dateKey} ${period} 예약을 삭제하시겠습니까?`)) {
                db.ref(`reservations/${dateKey}/${period}`).remove().then(() => alert("삭제되었습니다."));
            }
        }
    </script>
</body>
</html>
